<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>垂耳兔小手机 - V15 纯净音频版</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.5);
            --blur: blur(25px);
            --bg: #fff9e6;
            --delete-red: #ff6b6b;
            --twitter-blue: #1d9bf0;
            --music-red: #ff4d4f;
            --bunny-pink: #ffb6c1;
            --island-bg: #000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #222; display: flex; justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        #phone-wrapper {
            position: relative; width: 100%; height: 100%; max-width: 430px; max-height: 932px;
            background-color: var(--bg);
            background-size: cover; background-position: center;
            overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: background 0.3s;
        }

        /* 锁屏界面 */
        #lock-screen { 
            position: absolute; width: 100%; height: 100%; z-index: 100; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
            padding: 100px 0; background-color: var(--bg);
            background-image: linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
            background-size: cover; background-position: center;
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.2, 1);
            touch-action: none;
        }

        #home-screen { position: absolute; width: 100%; height: 100%; z-index: 50; background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }

        .top-nav {
            position: absolute; top: 50px; left: 0; width: 100%; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 1000;
            pointer-events: none; 
        }
        
        .nav-left-group { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }

        .nav-btn {
            background: rgba(255,255,255,0.95); padding: 8px 16px; border-radius: 20px;
            font-size: 13px; color: #333; cursor: pointer; border: none; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.1s;
            display: none; 
        }
        .nav-btn:active { transform: scale(0.95); }
        
        #diy-btn { background: var(--bunny-pink); color: white; }
        #done-btn { pointer-events: auto; background: #333; color: white;}

        .desktop-content { position: relative; width: 100%; height: calc(100% - 150px); margin-top: 35px; }

        /* App 样式 */
        .app-item, .widget-item { position: absolute; z-index: 10; transition: transform 0.2s, left 0.3s, top 0.3s; }
        .app-item { width: 85px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .app-icon { 
            width: 60px; height: 60px; background: #fff; border-radius: 16px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); pointer-events: none; 
            background-size: cover; background-position: center; overflow: hidden;
            background-repeat: no-repeat;
        }
        .app-name { font-size: 11px; margin-top: 6px; color: #444; font-weight: 500; pointer-events: none; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }

        .widget-item { border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; background: #fff; }

        /* --- 灵动岛样式 --- */
        .widget-island {
            width: 120px; height: 30px; 
            background: var(--island-bg); border-radius: 20px;
            color: white; display: flex; align-items: center; justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .widget-island.expanded {
            width: 370px !important; height: 100px !important;
            border-radius: 38px;
            padding: 12px 20px;
            justify-content: space-between;
        }

        .island-content-collapsed { display: flex; align-items: center; font-size: 12px; opacity: 1; transition: opacity 0.2s; white-space: nowrap; font-weight: 500; letter-spacing: 0.5px;}
        .widget-island.expanded .island-content-collapsed { opacity: 0; pointer-events: none; display: none; }

        .island-content-expanded { 
            display: none; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s 0.1s; 
            align-items: center; gap: 15px;
        }
        .widget-island.expanded .island-content-expanded { display: flex; opacity: 1; }

        .island-avatar {
            width: 76px; height: 76px; border-radius: 18px; background: #333; flex-shrink: 0;
            background-size: cover; background-position: center; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .island-text { 
            flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; justify-content: center; 
            margin-right: 10px;
        }
        .island-title { font-size: 16px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .island-subtitle { font-size: 12px; opacity: 0.7; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        .island-visualizer { 
            width: 30px; height: 24px; display: flex; align-items: flex-end; gap: 3px; 
            flex-shrink: 0; 
        }
        .bar { width: 5px; background: var(--bunny-pink); border-radius: 3px; animation: sound 0.8s infinite ease-in-out alternate; }
        .bar:nth-child(1) { height: 60%; animation-delay: 0s; }
        .bar:nth-child(2) { height: 100%; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 40%; animation-delay: 0.4s; }
        @keyframes sound { 0% { height: 30%; } 100% { height: 100%; } }

        /* 其他样式保持 */
        .icon-svg { width: 20px; height: 20px; fill: currentColor; }
        .icon-btn { cursor: pointer; opacity: 0.9; transition: transform 0.1s; }
        .icon-btn:active { transform: scale(0.85); }
        .widget-music { width: 385px; height: 185px; background: linear-gradient(145deg, #555, #222); color: white; padding: 22px; display: flex; align-items: center; gap: 24px; }
        .music-vinyl-container { position: relative; width: 135px; height: 135px; flex-shrink: 0; cursor: pointer; }
        .music-vinyl { width: 100%; height: 100%; border-radius: 50%; background: #111; padding: 25px; box-shadow: 0 0 25px rgba(0,0,0,0.4); animation: rotate 12s linear infinite; background-image: repeating-radial-gradient(circle, #222 0, #111 1px, #222 2px); position: relative; }
        .music-vinyl::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%); pointer-events: none; }
        .music-cover { width: 100%; height: 100%; border-radius: 50%; background: #333 center/cover; border: 2px solid #000; }
        .music-info { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
        .music-title { font-size: 20px; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .music-artist { font-size: 13px; opacity: 0.6; margin-bottom: 12px; }
        .music-controls { display: flex; align-items: center; gap: 20px; }
        .music-heart { color: var(--music-red); margin-left: auto; }
        .widget-twitter { width: 185px; height: 185px; }
        .tw-header { height: 40%; background: #eee center/cover; cursor: pointer; }
        .tw-content { position: relative; padding: 8px 12px; display: flex; flex-direction: column; height: 60%; }
        .tw-avatar { position: absolute; top: -25px; left: 12px; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #fff; background: #ddd center/cover; cursor: pointer; z-index: 5; }
        .tw-info-block { margin-top: 25px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .tw-name { font-size: 15px; font-weight: 800; color: #000; }
        .tw-handle { font-size: 11px; color: #536471; }
        .tw-bio { font-size: 11px; color: #333; margin-top: auto; margin-bottom: 5px; opacity: 0.9; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; outline: none; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .remove-btn { 
            position: absolute; top: -8px; left: -8px; width: 28px; height: 28px; 
            background: var(--delete-red); color: white; border-radius: 50%; 
            display: none; justify-content: center; align-items: center; 
            font-size: 20px; font-weight: bold; z-index: 3500; cursor: pointer; border: 2px solid white; 
        }
        .jiggling .remove-btn { display: flex; }
        .jiggling { animation: shake 0.3s infinite ease-in-out; }
        .dragging { z-index: 1000 !important; transform: scale(1.05) !important; opacity: 0.9; transition: none !important; }
        @keyframes shake { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }

        .dock-container { position: absolute; bottom: 35px; left: 20px; right: 20px; height: 95px; background: rgba(255,255,255,0.4); border-radius: 32px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(10px); z-index: 200; }
        .home-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; background: rgba(0,0,0,0.1); border-radius: 10px; cursor: pointer; z-index: 300; }

        .bottom-panel {
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 75%;
            background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top-left-radius: 35px; border-top-right-radius: 35px;
            z-index: 2000; transition: bottom 0.5s cubic-bezier(0.2, 1, 0.2, 1); padding: 30px; overflow-y: auto; display: flex; flex-direction: column;
        }
        .bottom-panel.active { bottom: 0; }
        .section-title { margin: 25px 0 15px; font-size: 16px; color: #111; font-weight: bold; border-left: 4px solid var(--bunny-pink); padding-left: 10px; }
        .close-panel-btn { margin-top: auto; width: 100%; padding: 15px; border-radius: 20px; border: none; background: #f0f0f0; font-weight: bold; font-size: 15px; cursor: pointer; }

        .wallpaper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .wallpaper-item { 
            height: 120px; background: #eee; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px dashed #ccc; position: relative; overflow: hidden;
            background-size: cover; background-position: center;
        }
        .wallpaper-label { background: rgba(0,0,0,0.5); color: white; padding: 4px 10px; border-radius: 10px; font-size: 12px; z-index: 2; pointer-events: none;}
        
        .app-edit-grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .app-edit-item { display: flex; flex-direction: column; align-items: center; width: 60px; cursor: pointer; }
        .app-edit-icon { 
            width: 55px; height: 55px; background: #fff; border-radius: 14px; 
            display: flex; justify-content: center; align-items: center; font-size: 24px; 
            border: 1px solid #eee; background-size: cover; background-position: center; 
        }
        .app-edit-name { font-size: 10px; margin-top: 5px; color: #666; text-align: center; }

        #db-loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #555; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
        #db-loading.show { opacity: 1; pointer-events: auto; }

        .upload-btn-large {
            width: 100%; padding: 15px; background: #f0f0f0; border-radius: 15px; border: 2px dashed #ccc;
            text-align: center; cursor: pointer; color: #666; font-size: 13px; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .upload-btn-large:active { background: #e5e5e5; }
    </style>
</head>
<body>

    <div id="phone-wrapper">
        <div id="db-loading" class="show">正在校准灵动岛...</div>

        <div id="lock-screen">
            <div style="text-align: center; pointer-events: none;">
                <h1 id="clock" style="font-size: 80px; font-weight: 200; color: #333;">20:45</h1>
                <p id="date-str" style="color: #555;">3月3日 星期二</p>
            </div>
            <p style="color: #666; font-weight: 500;">↑ 向上滑动解锁</p>
        </div>

        <div id="home-screen">
            <div class="top-nav">
                <div class="nav-left-group">
                    <button class="nav-btn" id="add-widget-btn">＋ 添加组件</button>
                    <button class="nav-btn" id="diy-btn">🐰 小兔DIY</button>
                </div>
                <button class="nav-btn" id="done-btn">完成</button>
            </div>
            <div class="desktop-content" id="desktop"></div>
            <div class="dock-container">
                <div class="app-icon" data-dock-id="dock-phone">📞</div>
                <div class="app-icon" data-dock-id="dock-msg">💬</div>
                <div class="app-icon" data-dock-id="dock-browser">🌐</div>
                <div class="app-icon" data-dock-id="dock-camera">📷</div>
            </div>
            <div class="home-bar" id="to-lock"></div>
        </div>

        <div id="widget-panel" class="bottom-panel">
            <h2 style="text-align: center; font-size: 20px; margin-bottom: 20px;">组件中心</h2>
            <div class="section-title">特别推荐</div>
            <div onclick="addNewWidget('island')" style="width: 100%; height: 60px; background: #000; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; cursor: pointer; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                🏝️ 添加灵动岛
            </div>
            <div class="section-title">媒体与社交</div>
            <div style="display: flex; gap: 15px;">
                <div onclick="addNewWidget('music')" style="width: 150px; height: 90px; background: #333; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: white; cursor: pointer;">🎵 网易云音乐</div>
                <div onclick="addNewWidget('twitter')" style="width: 100px; height: 90px; background: #fff; border: 1px solid #eee; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--twitter-blue); cursor: pointer;">𝕏 推特</div>
            </div>
            <div class="section-title">精选 App</div>
            <div id="app-store-grid" style="display: flex; gap: 15px; flex-wrap: wrap;"></div>
            <button class="close-panel-btn" onclick="closePanels()">返回桌面</button>
        </div>

        <div id="diy-panel" class="bottom-panel">
            <h2 style="text-align: center; font-size: 20px; margin-bottom: 10px;">🐰 小兔 DIY</h2>
            
            <div class="section-title">灵动岛音频配置</div>
            <div style="background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #eee;">
                <div style="font-size: 12px; color: #666; margin-bottom: 5px;">上传 MP3 音频文件:</div>
                <div class="upload-btn-large" onclick="triggerAudioUpload()">
                    🎵 <span id="audio-upload-text">点击选择 MP3 文件...</span>
                </div>
                <div style="font-size: 10px; color: #999; margin-top: 8px;">文件将自动保存在浏览器中，刷新不丢失。</div>
            </div>

            <div class="section-title">壁纸设置</div>
            <div class="wallpaper-grid">
                <div class="wallpaper-item" id="wp-lock-preview" onclick="triggerWallaper('lock')">
                    <div class="wallpaper-label">锁屏壁纸</div>
                </div>
                <div class="wallpaper-item" id="wp-home-preview" onclick="triggerWallaper('home')">
                    <div class="wallpaper-label">桌面壁纸</div>
                </div>
            </div>
            <div class="section-title">App & Dock 图标换肤</div>
            <div id="app-diy-grid" class="app-edit-grid"></div>
            <button class="close-panel-btn" onclick="closePanels()">完成装修</button>
        </div>

    </div>

    <!-- 各种输入框 -->
    <input type="file" id="image-input" accept="image/*" style="display: none;">
    <!-- 关键修复：这里的 accept 指定了 .mp3，并保留 audio/* 以防万一 -->
    <input type="file" id="audio-input" accept=".mp3, .m4a, .wav, audio/*" style="display: none;">
    
    <!-- 关键修复：使用 audio 标签替代 video，解决视频弹窗问题 -->
    <audio id="bg-audio" playsinline style="display: none;"></audio>

    <script>
        // --- V15 数据库 ---
        const DB_NAME = 'Rabbit_Ultra_Island_V15_LocalAudio'; 
        const DB_STORE = 'layout_data';
        let db;
        let globalImageCache = {}; 
        let customAppIcons = {}; 
        let activeEditType = ''; 
        let activeAppId = '';
        let islandAudioUrl = ''; 

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
                };
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onerror = (e) => reject(e);
            });
        }

        function saveToDB(key, val) {
            return new Promise((resolve) => {
                if(!db) return resolve();
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.objectStore(DB_STORE).put(val, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => resolve();
            });
        }

        function getFromDB(key) {
            return new Promise((resolve) => {
                if(!db) return resolve(null);
                const tx = db.transaction(DB_STORE, 'readonly');
                const req = tx.objectStore(DB_STORE).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        // --- DOM ---
        const desktop = document.getElementById('desktop');
        const lockScreen = document.getElementById('lock-screen');
        const phoneWrapper = document.getElementById('phone-wrapper');
        const widgetPanel = document.getElementById('widget-panel');
        const diyPanel = document.getElementById('diy-panel');
        const appStoreGrid = document.getElementById('app-store-grid');
        const appDiyGrid = document.getElementById('app-diy-grid');
        const imgInput = document.getElementById('image-input');
        const audioFileInput = document.getElementById('audio-input'); // 新增
        const loading = document.getElementById('db-loading');
        const addBtn = document.getElementById('add-widget-btn');
        const diyBtn = document.getElementById('diy-btn');
        const doneBtn = document.getElementById('done-btn');
        const audioEl = document.getElementById('bg-audio');
        const audioText = document.getElementById('audio-upload-text');

        // SVG 资源
        const SVGS = {
            play: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M8 5v14l11-7z"/></svg>',
            prev: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>',
            next: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>',
            heart_line: '<svg viewBox="0 0 24 24" class="icon-svg" style="fill:none;stroke:currentColor;stroke-width:2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
            heart_fill: '<svg viewBox="0 0 24 24" class="icon-svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'
        };

        const CELL_W = 100, CELL_H = 105; 
        let isEditing = false;
        let activeEl = null;
        let currentImgKey = null;

        const APP_DATABASE = {
            'app-gallery': { name: '相册', icon: '🎨' },
            'app-music': { name: '音乐', icon: '🎵' },
            'app-settings': { name: '设置', icon: '⚙️' },
            'app-camera': { name: '相机', icon: '📸' },
            'app-wechat': { name: '微信', icon: '💬' },
            'app-game': { name: '王者荣耀', icon: '⚔️' },
            'app-fitness': { name: '健身', icon: '⭕' },
            'app-bunny': { name: '垂耳兔', icon: '🐰' },
            'dock-phone': { name: '电话', icon: '📞' },
            'dock-msg': { name: '短信', icon: '💬' },
            'dock-browser': { name: '浏览', icon: '🌐' },
            'dock-camera': { name: '拍照', icon: '📷' }
        };

        async function saveLayout() {
            const items = [];
            desktop.querySelectorAll('.app-item, .widget-item').forEach(el => {
                const item = {
                    id: el.dataset.id, type: el.dataset.type,
                    col: el.dataset.col, row: el.dataset.row
                };
                if (item.type === 'twitter') {
                    item.data = { 
                        bg: globalImageCache[item.id + '_bg'], 
                        avatar: globalImageCache[item.id + '_avatar'], 
                        name: el.querySelector('.tw-name').innerText, 
                        handle: el.querySelector('.tw-handle').innerText,
                        bio: el.querySelector('.tw-bio').innerText
                    };
                } else if (item.type === 'music') {
                    item.data = { 
                        cover: globalImageCache[item.id + '_cover'], 
                        title: el.querySelector('.music-title').innerText, 
                        artist: el.querySelector('.music-artist').innerText 
                    };
                } else if (item.type === 'island') {
                    item.data = {
                        avatar: globalImageCache[item.id + '_island'],
                        title: el.querySelector('.island-title').innerText,
                        subtitle: el.querySelector('.island-subtitle').innerText
                    }
                }
                items.push(item);
            });
            await saveToDB('layout', items);
            
            const settings = {
                lockBg: globalImageCache['wallpaper_lock'],
                homeBg: globalImageCache['wallpaper_home'],
                customIcons: customAppIcons
                // audio is saved separately as blob
            };
            for(let appId in customAppIcons) {
                settings['icon_img_' + appId] = globalImageCache['icon_' + appId];
            }
            await saveToDB('settings', settings);
        }

        async function loadLayout() {
            try {
                await initDB();
                const savedLayout = await getFromDB('layout');
                const savedSettings = await getFromDB('settings');
                // 加载音频Blob
                const audioBlob = await getFromDB('island_audio_blob');
                
                loading.classList.remove('show');

                if(savedSettings) {
                    if(savedSettings.lockBg) {
                        globalImageCache['wallpaper_lock'] = savedSettings.lockBg;
                        lockScreen.style.backgroundImage = savedSettings.lockBg;
                        document.getElementById('wp-lock-preview').style.backgroundImage = savedSettings.lockBg;
                    }
                    if(savedSettings.homeBg) {
                        globalImageCache['wallpaper_home'] = savedSettings.homeBg;
                        phoneWrapper.style.backgroundImage = savedSettings.homeBg;
                        document.getElementById('wp-home-preview').style.backgroundImage = savedSettings.homeBg;
                    }
                    if(savedSettings.customIcons) {
                        customAppIcons = savedSettings.customIcons;
                        for(let appId in customAppIcons) {
                            globalImageCache['icon_' + appId] = savedSettings['icon_img_' + appId];
                        }
                    }
                }

                if(audioBlob) {
                    islandAudioUrl = URL.createObjectURL(audioBlob);
                    audioText.innerText = "已加载本地 MP3 (点击更换)";
                }

                ['dock-phone', 'dock-msg', 'dock-browser', 'dock-camera'].forEach(dockId => {
                    const dockEl = document.querySelector(`.app-icon[data-dock-id="${dockId}"]`);
                    if(dockEl && customAppIcons[dockId] && globalImageCache['icon_' + dockId]) {
                        dockEl.innerText = '';
                        dockEl.style.backgroundImage = globalImageCache['icon_' + dockId];
                    }
                });

                desktop.innerHTML = '';
                if (savedLayout && savedLayout.length > 0) {
                    savedLayout.forEach(item => {
                        if(item.type === 'twitter') {
                            globalImageCache[item.id + '_bg'] = item.data.bg;
                            globalImageCache[item.id + '_avatar'] = item.data.avatar;
                            createTwitterWidget(item.col, item.row, item.id, item.data);
                        }
                        else if(item.type === 'music') {
                            globalImageCache[item.id + '_cover'] = item.data.cover;
                            createMusicWidget(item.col, item.row, item.id, item.data);
                        }
                        else if(item.type === 'island') {
                            globalImageCache[item.id + '_island'] = item.data.avatar;
                            createIslandWidget(item.col, item.row, item.id, item.data);
                        }
                        else if (item.type === 'app') {
                            createAppElement(item.id, item.col, item.row);
                        }
                    });
                } else {
                    createIslandWidget(1, 0, 'island-init'); 
                    createAppElement('app-bunny', 2, 2);
                    createAppElement('app-gallery', 3, 2);
                }

                setTimeout(() => {
                    document.querySelectorAll('.app-item').forEach(el => {
                        const id = el.dataset.id;
                        const iconKey = 'icon_' + id;
                        if(customAppIcons[id] && globalImageCache[iconKey]) {
                            const iconEl = el.querySelector('.app-icon');
                            iconEl.innerText = '';
                            iconEl.style.backgroundImage = globalImageCache[iconKey];
                        }
                    });
                }, 50);

                updateAppStore();
                updateDiyGrid();
            } catch (e) { console.error(e); loading.innerText = "出错了"; }
        }

        function triggerAudioUpload() {
            audioFileInput.click();
        }

        // --- 音频文件上传逻辑 ---
        audioFileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if(file) {
                audioText.innerText = "正在保存...";
                // 1. 保存到 IndexedDB
                await saveToDB('island_audio_blob', file);
                // 2. 生成 URL
                islandAudioUrl = URL.createObjectURL(file);
                audioText.innerText = "上传成功！(已保存)";
                alert('MP3 音频上传成功！点击灵动岛即可播放~');
            }
        };

        // --- 组件创建 ---
        
        function createIslandWidget(col, row, id, data = null) {
            const div = document.createElement('div');
            div.className = 'widget-item widget-island';
            div.dataset.id = id || 'island-' + Date.now();
            div.dataset.type = 'island';
            
            div.style.left = '50%';
            div.style.transform = 'translateX(-50%)'; 
            div.style.top = '5px'; 
            
            const d = data || { title: "垂耳兔", subtitle: "希望兔兔机可以给你带来快乐^ ^" };

            div.innerHTML = `
                <div class="island-content-collapsed"></div>
                <div class="island-content-expanded">
                    <div class="island-avatar"></div>
                    <div class="island-text">
                        <div class="island-title" contenteditable="true">${d.title}</div>
                        <div class="island-subtitle" contenteditable="true">${d.subtitle}</div>
                    </div>
                    <div class="island-visualizer">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    </div>
                </div>
                <div class="remove-btn">×</div>
            `;

            const imgKey = div.dataset.id + '_island';
            if(globalImageCache[imgKey]) div.querySelector('.island-avatar').style.backgroundImage = globalImageCache[imgKey];
            else {
                 const def = "url('https://picsum.photos/seed/handsome/100')";
                 div.querySelector('.island-avatar').style.backgroundImage = def;
                 globalImageCache[imgKey] = def;
            }

            div.onclick = (e) => {
                if(isEditing) return;
                if(e.target.closest('[contenteditable]') || e.target.classList.contains('remove-btn')) return;
                
                div.classList.toggle('expanded');
                
                if(div.classList.contains('expanded')) {
                    if(islandAudioUrl) {
                        audioEl.src = islandAudioUrl;
                        audioEl.load();
                        audioEl.play().catch(e => {
                            console.log('自动播放受限');
                        });
                    } else {
                        // 如果没有上传，提示一下
                        if(!audioText.innerText.includes('已加载')) {
                            // alert('去“小兔DIY”里上传一个声音吧！');
                        }
                    }
                } else {
                    audioEl.pause();
                }
            };

            div.querySelector('.island-avatar').onclick = (e) => {
                if(!isEditing) {
                     e.stopPropagation(); 
                     activeEditType = 'widget'; 
                     currentImgKey = imgKey; 
                     imgInput.click();
                }
            };

            document.addEventListener('click', (e) => {
                if (!div.contains(e.target)) {
                    div.classList.remove('expanded');
                    audioEl.pause();
                }
            });

            div.querySelectorAll('[contenteditable]').forEach(el => {
                el.onclick = (e) => e.stopPropagation(); 
                el.onblur = () => saveLayout();
            });
            div.querySelector('.remove-btn').onclick = (e) => { 
                e.stopPropagation(); 
                div.remove(); 
                updateAppStore(); 
                saveLayout(); 
            };

            desktop.appendChild(div);
        }

        function createMusicWidget(col, row, id, data = null) {
            const div = document.createElement('div');
            div.className = 'widget-item widget-music';
            div.dataset.id = id || 'm-' + Date.now();
            div.dataset.type = 'music';
            div.dataset.col = col; div.dataset.row = row;
            const d = data || { title: "Boyfriend", artist: "Justin Bieber" };
            div.innerHTML = `<div class="music-vinyl-container"><div class="music-vinyl"><div class="music-cover"></div></div></div><div class="music-info"><div class="music-title" contenteditable="true">${d.title}</div><div class="music-artist" contenteditable="true">${d.artist}</div><div class="music-controls"><div class="icon-btn">${SVGS.prev}</div><div class="icon-btn" style="transform: scale(1.4);">${SVGS.play}</div><div class="icon-btn">${SVGS.next}</div><div class="music-heart icon-btn">${SVGS.heart_line}</div></div></div><div class="remove-btn">×</div>`;
            
            const coverKey = div.dataset.id + '_cover';
            if (globalImageCache[coverKey]) div.querySelector('.music-cover').style.backgroundImage = globalImageCache[coverKey];
            else if(!data) { 
                const def = "url('https://picsum.photos/seed/music/200')";
                div.querySelector('.music-cover').style.backgroundImage = def;
                globalImageCache[coverKey] = def;
            }

            div.querySelector('.music-vinyl-container').onclick = () => { if(!isEditing) { activeEditType='widget'; currentImgKey=coverKey; imgInput.click(); } };
            const heart = div.querySelector('.music-heart');
            heart.onclick = () => { heart.innerHTML = heart.innerHTML.includes('none') ? SVGS.heart_fill : SVGS.heart_line; saveLayout(); };
            div.querySelectorAll('[contenteditable]').forEach(el => el.onblur = () => saveLayout());
            desktop.appendChild(div); initDrag(div);
        }

        function createTwitterWidget(col, row, id, data = null) {
            const div = document.createElement('div');
            div.className = 'widget-item widget-twitter';
            div.dataset.id = id || 'tw-' + Date.now();
            div.dataset.type = 'twitter';
            div.dataset.col = col; div.dataset.row = row;
            const d = data || { name: "XX", handle: "@QwQ_520", bio: "这里是心情签名..." };
            div.innerHTML = `<div class="tw-header"></div><div class="tw-content"><div class="tw-avatar"></div><div class="tw-info-block"><div class="tw-name" contenteditable="true">${d.name}</div><div class="tw-handle" contenteditable="true">${d.handle}</div></div><div class="tw-bio" contenteditable="true">${d.bio}</div></div><div class="remove-btn">×</div>`;

            const bgKey = div.dataset.id + '_bg';
            const avatarKey = div.dataset.id + '_avatar';
            if(!globalImageCache[bgKey] && !data) globalImageCache[bgKey] = "url('https://picsum.photos/seed/bg/300/150')";
            if(!globalImageCache[avatarKey] && !data) globalImageCache[avatarKey] = "url('https://picsum.photos/seed/bunny/100')";

            if (globalImageCache[bgKey]) div.querySelector('.tw-header').style.backgroundImage = globalImageCache[bgKey];
            if (globalImageCache[avatarKey]) div.querySelector('.tw-avatar').style.backgroundImage = globalImageCache[avatarKey];

            div.querySelector('.tw-header').onclick = () => { if(!isEditing) { activeEditType='widget'; currentImgKey=bgKey; imgInput.click(); } };
            div.querySelector('.tw-avatar').onclick = () => { if(!isEditing) { activeEditType='widget'; currentImgKey=avatarKey; imgInput.click(); } };
            div.querySelectorAll('[contenteditable]').forEach(el => el.onblur = () => saveLayout());
            desktop.appendChild(div); initDrag(div);
        }

        function createAppElement(id, col, row) {
            const data = APP_DATABASE[id];
            const div = document.createElement('div');
            div.className = 'app-item'; div.dataset.id = id; div.dataset.type = 'app';
            div.dataset.col = col; div.dataset.row = row;
            
            let iconContent = data.icon;
            let iconStyle = '';
            if (customAppIcons[id] && globalImageCache['icon_' + id]) {
                iconContent = ''; 
                iconStyle = `background-image: ${globalImageCache['icon_' + id]};`;
            }

            div.innerHTML = `<div class="app-icon" style="${iconStyle}">${iconContent}</div><div class="app-name">${data.name}</div><div class="remove-btn">×</div>`;
            desktop.appendChild(div); initDrag(div);
        }

        // --- 拖拽与逻辑 ---
        function findEmptySpot() {
            const grid = Array(7).fill().map(() => Array(4).fill(false));
            document.querySelectorAll('.app-item, .widget-item').forEach(el => {
                if(el.dataset.type === 'island') return; 
                let r = parseInt(el.dataset.row), c = parseInt(el.dataset.col);
                let type = el.dataset.type;
                if(r >= 0 && r < 7 && c >= 0 && c < 4) {
                    grid[r][c] = true;
                    if(type === 'music') grid[r][c+1] = true;
                    if(type === 'twitter' || type === 'music') { if(r+1 < 7) { grid[r+1][c] = true; if(type === 'music') grid[r+1][c+1] = true; } }
                }
            });
            for(let r=0; r<6; r++) { for(let c=0; c<4; c++) { if(!grid[r][c]) return { r, c }; } }
            return { r: 0, c: 0 };
        }

        function initDrag(el) {
            if(el.dataset.type === 'island') return;

            el.style.left = (15 + el.dataset.col * CELL_W) + 'px';
            el.style.top = (0 + el.dataset.row * CELL_H) + 'px';
            if(el.querySelector('.remove-btn')) el.querySelector('.remove-btn').onclick = (e) => { e.stopPropagation(); el.remove(); updateAppStore(); saveLayout(); };
            
            const start = e => {
                if(!isEditing || e.target.closest('[contenteditable]')) return;
                activeEl = el; const ev = e.touches ? e.touches[0] : e;
                const rect = el.getBoundingClientRect();
                const ox = ev.clientX - rect.left, oy = ev.clientY - rect.top;
                const moveHandler = move => {
                    const mev = move.touches ? move.touches[0] : move;
                    const dRect = desktop.getBoundingClientRect();
                    el.classList.add('dragging');
                    el.style.left = (mev.clientX - dRect.left - ox) + 'px';
                    el.style.top = (mev.clientY - dRect.top - oy) + 'px';
                };
                const endHandler = () => {
                    window.removeEventListener('mousemove', moveHandler); window.removeEventListener('touchmove', moveHandler);
                    window.removeEventListener('mouseup', endHandler); window.removeEventListener('touchend', endHandler);
                    if (activeEl && isEditing) {
                        let col = Math.round((parseFloat(activeEl.style.left) - 15) / CELL_W);
                        let row = Math.round((parseFloat(activeEl.style.top) - 0) / CELL_H);
                        activeEl.dataset.col = Math.max(0, Math.min(activeEl.dataset.type==='music' ? 2 : 3, col)); 
                        activeEl.dataset.row = Math.max(0, Math.min(6, row));
                        activeEl.classList.remove('dragging');
                        activeEl.style.left = (15 + activeEl.dataset.col * CELL_W) + 'px';
                        activeEl.style.top = (0 + activeEl.dataset.row * CELL_H) + 'px';
                        saveLayout();
                    }
                    activeEl = null;
                };
                window.addEventListener('mousemove', moveHandler); window.addEventListener('touchmove', moveHandler, {passive: false});
                window.addEventListener('mouseup', endHandler); window.addEventListener('touchend', endHandler);
            };
            el.addEventListener('mousedown', start); el.addEventListener('touchstart', start);
        }

        // --- 面板控制 ---
        function updateAppStore() {
            appStoreGrid.innerHTML = '';
            const installedIds = Array.from(document.querySelectorAll('.app-item')).map(el => el.dataset.id);
            for (let id in APP_DATABASE) {
                if(id.startsWith('dock-')) continue; 
                if (!installedIds.includes(id)) {
                    const div = document.createElement('div');
                    div.style = "display:flex; flex-direction:column; align-items:center; cursor:pointer;";
                    div.innerHTML = `<div class="app-icon" style="width:55px; height:55px; font-size:26px;">${APP_DATABASE[id].icon}</div><div style="font-size:10px; margin-top:4px;">${APP_DATABASE[id].name}</div>`;
                    div.onclick = () => { 
                        const spot = findEmptySpot(); createAppElement(id, spot.c, spot.r); 
                        if(isEditing) desktop.lastChild.classList.add('jiggling'); 
                        updateAppStore(); saveLayout(); 
                    };
                    appStoreGrid.appendChild(div);
                }
            }
        }

        function updateDiyGrid() {
            appDiyGrid.innerHTML = '';
            for (let id in APP_DATABASE) {
                const div = document.createElement('div');
                div.className = 'app-edit-item';
                
                let style = ''; let content = APP_DATABASE[id].icon;
                if(customAppIcons[id] && globalImageCache['icon_' + id]) {
                    style = `background-image: ${globalImageCache['icon_' + id]}`;
                    content = '';
                }

                div.innerHTML = `<div class="app-edit-icon" style="${style}">${content}</div><div class="app-edit-name">${APP_DATABASE[id].name}</div>`;
                div.onclick = () => {
                    activeEditType = 'app-icon';
                    activeAppId = id;
                    imgInput.click();
                };
                appDiyGrid.appendChild(div);
            }
        }

        function addNewWidget(type) {
            const spot = findEmptySpot(type === 'music');
            if(type === 'twitter') createTwitterWidget(spot.c, spot.r); 
            else if(type === 'island') createIslandWidget(0, 0); 
            else createMusicWidget(spot.c, spot.r);
            
            if(isEditing) desktop.lastChild.classList.add('jiggling');
            closePanels(); saveLayout();
        }

        function closePanels() {
            widgetPanel.classList.remove('active');
            diyPanel.classList.remove('active');
        }

        addBtn.onclick = () => { updateAppStore(); closePanels(); widgetPanel.classList.add('active'); };
        diyBtn.onclick = () => { updateDiyGrid(); closePanels(); diyPanel.classList.add('active'); };

        function triggerWallaper(type) {
            activeEditType = (type === 'lock' ? 'wallpaper-lock' : 'wallpaper-home');
            imgInput.click();
        }

        imgInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const cssUrl = `url("${event.target.result}")`;

                    if (activeEditType === 'widget') {
                        globalImageCache[currentImgKey] = cssUrl;
                        if(currentImgKey.includes('cover')) {
                            const id = currentImgKey.split('_')[0];
                            const el = document.querySelector(`.widget-music[data-id="${id}"] .music-cover`);
                            if(el) el.style.backgroundImage = cssUrl;
                        } else if(currentImgKey.includes('bg')) {
                            const id = currentImgKey.split('_')[0];
                            const el = document.querySelector(`.widget-twitter[data-id="${id}"] .tw-header`);
                            if(el) el.style.backgroundImage = cssUrl;
                        } else if(currentImgKey.includes('avatar')) {
                            const id = currentImgKey.split('_')[0];
                            const el = document.querySelector(`.widget-twitter[data-id="${id}"] .tw-avatar`);
                            if(el) el.style.backgroundImage = cssUrl;
                        } else if(currentImgKey.includes('island')) {
                            const id = currentImgKey.split('_')[0];
                            const el = document.querySelector(`.widget-island[data-id="${id}"] .island-avatar`);
                            if(el) el.style.backgroundImage = cssUrl;
                        }
                    } 
                    else if (activeEditType === 'wallpaper-lock') {
                        globalImageCache['wallpaper_lock'] = cssUrl;
                        lockScreen.style.backgroundImage = cssUrl;
                        document.getElementById('wp-lock-preview').style.backgroundImage = cssUrl;
                    }
                    else if (activeEditType === 'wallpaper-home') {
                        globalImageCache['wallpaper_home'] = cssUrl;
                        phoneWrapper.style.backgroundImage = cssUrl;
                        document.getElementById('wp-home-preview').style.backgroundImage = cssUrl;
                    }
                    else if (activeEditType === 'app-icon') {
                        globalImageCache['icon_' + activeAppId] = cssUrl;
                        customAppIcons[activeAppId] = true; 
                        const desktopApp = document.querySelector(`.app-item[data-id="${activeAppId}"] .app-icon`);
                        if (desktopApp) { desktopApp.innerText = ''; desktopApp.style.backgroundImage = cssUrl; }
                        const dockApp = document.querySelector(`.app-icon[data-dock-id="${activeAppId}"]`);
                        if(dockApp) { dockApp.innerText = ''; dockApp.style.backgroundImage = cssUrl; }
                        updateDiyGrid(); 
                    }

                    saveLayout(); 
                };
            }
            imgInput.value = ''; 
        };

        // --- 交互 ---
        desktop.addEventListener('touchstart', (e) => {
            if (isEditing || e.target.closest('.remove-btn') || e.target.closest('[contenteditable]') || e.target.closest('.icon-btn') || e.target.classList.contains('widget-island')) return;
            longPressTimer = setTimeout(() => { 
                isEditing = true; 
                doneBtn.style.display = 'block'; 
                addBtn.style.display = 'block';
                diyBtn.style.display = 'block';
                document.querySelectorAll('.app-item, .widget-item').forEach(el => {
                    if(!el.classList.contains('widget-island')) el.classList.add('jiggling');
                });
                document.querySelectorAll('.widget-island').forEach(el => el.classList.add('jiggling')); 
            }, 800);
        });
        desktop.addEventListener('touchend', () => clearTimeout(longPressTimer));
        
        doneBtn.onclick = () => { 
            isEditing = false; 
            doneBtn.style.display = 'none'; 
            addBtn.style.display = 'none';
            diyBtn.style.display = 'none';
            document.querySelectorAll('.app-item, .widget-item').forEach(el => el.classList.remove('jiggling')); 
            saveLayout(); 
        };

        let lStartY = 0;
        lockScreen.ontouchstart = (e) => { lStartY = e.touches[0].clientY; lockScreen.style.transition = 'none'; };
        lockScreen.ontouchmove = (e) => { let diff = e.touches[0].clientY - lStartY; if (diff < 0) lockScreen.style.transform = `translateY(${diff}px)`; };
        lockScreen.ontouchend = (e) => { lockScreen.style.transition = 'transform 0.4s ease'; if (e.changedTouches[0].clientY - lStartY < -150) lockScreen.style.transform = 'translateY(-100%)'; else lockScreen.style.transform = 'translateY(0)'; };
        document.getElementById('to-lock').onclick = () => { if(!isEditing) lockScreen.style.transform = 'translateY(0)'; };

        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            document.getElementById('date-str').innerText = `${d.getMonth()+1}月${d.getDate()}日 星期${days[d.getDay()]}`;
        }, 1000);

        loadLayout(); 
    </script>
</body>
</html>
