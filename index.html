<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>垂耳兔小手机</title>


<!-- ================= 桌面图标与全屏沉浸配置 ================= -->
<link rel="icon" href="https://free.boltp.com/2026/03/07/69ac4972abd19.webp">
<link rel="apple-touch-icon" href="https://free.boltp.com/2026/03/07/69ac4972abd19.webp">
<meta name="apple-mobile-web-app-title" content="垂耳兔手机">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
    :root {
        /* 增加动态尺寸变量的基础值 */
        --cell-w: 85px; 
        --cell-h: 100px;
        --glass: rgba(255, 255, 255, 0.5);
        --blur: blur(25px);
        --bg: #000000;
        --delete-red: #ff6b6b;
        --twitter-blue: #1d9bf0;
        --music-red: #ff4d4f;
        --bunny-pink: #ffb6c1;
        --island-bg: #000;
    }


* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body, html { 
    width: 100%; 
    height: 100%;
    overflow: hidden; 
    background: #000;
    margin: 0; padding: 0;
    display: block; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    overscroll-behavior: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
}

#phone-wrapper {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; 
    height: 100%;
    background-color: #000; 
    background-size: cover; 
    background-position: center;
    overflow: hidden; 
    transition: background 0.3s;
}

/* 锁屏界面 */
#lock-screen { 
    position: absolute; width: 100%; height: 100%; z-index: 100; 
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
    padding: 100px 0; background-color: var(--bg);
    background-image: linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
    background-size: cover; background-position: center;
    transition: transform 0.4s cubic-bezier(0.2, 1, 0.2, 1);
    touch-action: none;
}

#home-screen { position: absolute; width: 100%; height: 100%; z-index: 50; background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); background-size: cover; background-position: center; }

.top-nav {
    position: absolute; top: 50px; left: 0; width: 100%; padding: 0 20px;
    display: flex; justify-content: space-between; align-items: flex-start; z-index: 1000;
    pointer-events: none; 
}

.nav-left-group { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }

.nav-btn {
    background: rgba(255,255,255,0.95); padding: 8px 16px; border-radius: 20px;
    font-size: 13px; color: #333; cursor: pointer; border: none; font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.1s;
    display: none; 
}
.nav-btn:active { transform: scale(0.95); }

#diy-btn { background: var(--bunny-pink); color: white; }
#done-btn { pointer-events: auto; background: #333; color: white;}

.desktop-content { position: relative; width: 100%; height: calc(100% - 16dvh); margin-top: 3dvh; }

/* App 与小组件自适应样式 */
.app-item, .widget-item { position: absolute; z-index: 10; transition: transform 0.2s, left 0.3s, top 0.3s; }
.app-item { width: var(--cell-w); height: var(--cell-h); display: flex; flex-direction: column; align-items: center; justify-content: center; }

.app-icon { 
    width: calc(var(--cell-w) * 0.72); height: calc(var(--cell-w) * 0.72); 
    max-width: 65px; max-height: 65px;
    background: #fff; border-radius: 22.5%; 
    display: flex; justify-content: center; align-items: center; 
    font-size: clamp(20px, 6vw, 30px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); pointer-events: none; 
    background-size: cover; background-position: center; overflow: hidden; background-repeat: no-repeat;
}
.app-name { font-size: clamp(10px, 2.5vw, 12px); margin-top: 6px; color: #444; font-weight: 500; pointer-events: none; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }

.widget-item { border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; background: #fff; }

/* --- 灵动岛样式 --- */
.widget-island {
    width: 120px; height: 30px; 
    background: var(--island-bg); border-radius: 20px;
    color: white; display: flex; align-items: center; justify-content: center;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 3000; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.widget-island.expanded { width: 370px !important; height: 100px !important; border-radius: 38px; padding: 12px 20px; justify-content: space-between; }
.island-content-collapsed { display: flex; align-items: center; font-size: 12px; opacity: 1; transition: opacity 0.2s; white-space: nowrap; font-weight: 500; letter-spacing: 0.5px;}
.widget-island.expanded .island-content-collapsed { opacity: 0; pointer-events: none; display: none; }
.island-content-expanded { display: none; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s 0.1s; align-items: center; gap: 15px; }
.widget-island.expanded .island-content-expanded { display: flex; opacity: 1; }
.island-avatar { width: 76px; height: 76px; border-radius: 18px; background: #333; flex-shrink: 0; background-size: cover; background-position: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.island-text { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; justify-content: center; margin-right: 10px; }
.island-title { font-size: 16px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.island-subtitle { font-size: 12px; opacity: 0.7; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.island-visualizer { width: 30px; height: 24px; display: flex; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.bar { width: 5px; background: var(--bunny-pink); border-radius: 3px; animation: sound 0.8s infinite ease-in-out alternate; }
.bar:nth-child(1) { height: 60%; animation-delay: 0s; }
.bar:nth-child(2) { height: 100%; animation-delay: 0.2s; }
.bar:nth-child(3) { height: 40%; animation-delay: 0.4s; }
@keyframes sound { 0% { height: 30%; } 100% { height: 100%; } }

/* 组件内部自适应 */
.icon-svg { width: 20px; height: 20px; fill: currentColor; }
.icon-btn { cursor: pointer; opacity: 0.9; transition: transform 0.1s; }
.icon-btn:active { transform: scale(0.85); }

.widget-music { width: calc(var(--cell-w) * 4 - 12px); height: calc(var(--cell-h) * 2 - 12px); background: linear-gradient(145deg, #555, #222); color: white; padding: 5%; display: flex; align-items: center; gap: 5%; }
.music-vinyl-container { position: relative; width: calc(var(--cell-h) * 1.3); height: calc(var(--cell-h) * 1.3); flex-shrink: 0; cursor: pointer; }
.music-vinyl { width: 100%; height: 100%; border-radius: 50%; background: #111; padding: 25px; box-shadow: 0 0 25px rgba(0,0,0,0.4); animation: rotate 12s linear infinite; background-image: repeating-radial-gradient(circle, #222 0, #111 1px, #222 2px); position: relative; }
.music-vinyl::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%); pointer-events: none; }
.music-cover { width: 100%; height: 100%; border-radius: 50%; background: #333 center/cover; border: 2px solid #000; }
.music-info { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.music-title { font-size: clamp(14px, 4vw, 20px); font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.music-artist { font-size: clamp(10px, 3vw, 13px); opacity: 0.6; margin-bottom: 8%; }
.music-controls { display: flex; align-items: center; gap: 20px; }
.music-heart { color: var(--music-red); margin-left: auto; }

.widget-twitter { width: calc(var(--cell-w) * 2 - 12px); height: calc(var(--cell-h) * 2 - 12px); }
.tw-header { height: 40%; background: #eee center/cover; cursor: pointer; }
.tw-content { position: relative; padding: 8px 12px; display: flex; flex-direction: column; height: 60%; }
.tw-avatar { position: absolute; top: -25px; left: 12px; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #fff; background: #ddd center/cover; cursor: pointer; z-index: 5; }
.tw-info-block { margin-top: 25px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.tw-name { font-size: clamp(12px, 3.5vw, 15px); font-weight: 800; color: #000; }
.tw-handle { font-size: 11px; color: #536471; }
.tw-bio { font-size: clamp(10px, 2.5vw, 11px); color: #333; margin-top: auto; margin-bottom: 5px; opacity: 0.9; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; outline: none; }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.remove-btn { 
    position: absolute; top: -8px; left: -8px; width: 28px; height: 28px; 
    background: var(--delete-red); color: white; border-radius: 50%; 
    display: none; justify-content: center; align-items: center; 
    font-size: 20px; font-weight: bold; z-index: 3500; cursor: pointer; border: 2px solid white; 
}
.jiggling .remove-btn { display: flex; }
.jiggling { animation: shake 0.3s infinite ease-in-out; }
.dragging { z-index: 1000 !important; transform: scale(1.05) !important; opacity: 0.9; transition: none !important; }
@keyframes shake { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }

.dock-container { position: absolute; bottom: 3dvh; left: 20px; right: 20px; height: 95px; background: rgba(255,255,255,0.4); border-radius: 32px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(10px); z-index: 200; }
.home-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; background: rgba(0,0,0,0.1); border-radius: 10px; cursor: pointer; z-index: 300; }

.bottom-panel {
    position: absolute; bottom: -100%; left: 0; width: 100%; height: 75%;
    background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top-left-radius: 35px; border-top-right-radius: 35px;
    z-index: 2000; transition: bottom 0.5s cubic-bezier(0.2, 1, 0.2, 1); padding: 30px; overflow-y: auto; display: flex; flex-direction: column;
}
.bottom-panel.active { bottom: 0; }
.section-title { margin: 25px 0 15px; font-size: 16px; color: #111; font-weight: bold; border-left: 4px solid var(--bunny-pink); padding-left: 10px; }
.close-panel-btn { margin-top: auto; width: 100%; padding: 15px; border-radius: 20px; border: none; background: #f0f0f0; font-weight: bold; font-size: 15px; cursor: pointer; }

.wallpaper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.wallpaper-item { 
    height: 120px; background: #eee; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px dashed #ccc; position: relative; overflow: hidden;
    background-size: cover; background-position: center;
}
.wallpaper-label { background: rgba(0,0,0,0.5); color: white; padding: 4px 10px; border-radius: 10px; font-size: 12px; z-index: 2; pointer-events: none;}

.app-edit-grid { display: flex; flex-wrap: wrap; gap: 15px; }
.app-edit-item { display: flex; flex-direction: column; align-items: center; width: 60px; cursor: pointer; }
.app-edit-icon { 
    width: 55px; height: 55px; background: #fff; border-radius: 14px; 
    display: flex; justify-content: center; align-items: center; font-size: 24px; 
    border: 1px solid #eee; background-size: cover; background-position: center; 
}
.app-edit-name { font-size: 10px; margin-top: 5px; color: #666; text-align: center; }

#db-loading { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #555; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
#db-loading.show { opacity: 1; pointer-events: auto; }

.upload-btn-large {
    width: 100%; padding: 15px; background: #f0f0f0; border-radius: 15px; border: 2px dashed #ccc;
    text-align: center; cursor: pointer; color: #666; font-size: 13px; margin-top: 10px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
}
.upload-btn-large:active { background: #e5e5e5; }

/* ===== App 打开层 ===== */
#app-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 200;
    display: none;
    background: #fff;
    border-radius: inherit;
    overflow: hidden;
}
#app-overlay.open {
    display: block;
    animation: appOpen 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
}
@keyframes appOpen {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
}
#app-iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
}
/* ===== 软萌备忘录小组件 ===== */
.widget-memo {
    width: calc(var(--cell-w) * 2 - 12px);
    height: calc(var(--cell-h) * 2 - 12px);
    background: #fffafa;
    border-radius: 20px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    position: relative;
    background-image: radial-gradient(#ffe0e6 1.5px, transparent 1.5px);
    background-size: 10px 10px; 
    border: 2px solid #fff0f3;
    box-shadow: 0 4px 10px rgba(255,182,193,0.15);
}
.memo-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    height: 50px; margin-bottom: 5px;
}
.memo-avatar {
    width: 45px; height: 45px; border-radius: 50%;
    background: #ddd center/cover; border: 2px solid #fff;
    cursor: pointer; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.memo-decor { font-size: 14px; color: #ffb6c1; font-weight: bold; text-shadow: 1px 1px 0 #fff; margin-top: 5px; }
.memo-lines { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.memo-line { display: flex; align-items: flex-end; gap: 8px; }
.memo-icon { font-size: 16px; margin-bottom: 2px; }
.memo-text {
    flex: 1; border-bottom: 2px dashed #ffc0cb; font-size: 12px; color: #666;
    padding-bottom: 2px; outline: none; white-space: nowrap; overflow: hidden;
}


</style>

</head>

<script>
    // --- V15 数据库 ---
    const DB_NAME = 'Rabbit_Ultra_Island_V15_LocalAudio'; 
    const DB_STORE = 'layout_data';
    let db;
    let globalImageCache = {}; 
    let customAppIcons = {}; 
    let activeEditType = ''; 
    let activeAppId = '';
    let islandAudioUrl = ''; 

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
            };
            request.onsuccess = (e) => { db = e.target.result; resolve(db); };
            request.onerror = (e) => reject(e);
        });
    }

    function saveToDB(key, val) {
        return new Promise((resolve) => {
            if(!db) return resolve();
            const tx = db.transaction(DB_STORE, 'readwrite');
            tx.objectStore(DB_STORE).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
        });
    }

    function getFromDB(key) {
        return new Promise((resolve) => {
            if(!db) return resolve(null);
            const tx = db.transaction(DB_STORE, 'readonly');
            const req = tx.objectStore(DB_STORE).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
        });
    }

    // --- DOM ---
    const desktop = document.getElementById('desktop');
    const lockScreen = document.getElementById('lock-screen');
    const phoneWrapper = document.getElementById('phone-wrapper');
    const widgetPanel = document.getElementById('widget-panel');
    const diyPanel = document.getElementById('diy-panel');
    const appStoreGrid = document.getElementById('app-store-grid');
    const appDiyGrid = document.getElementById('app-diy-grid');
    const imgInput = document.getElementById('image-input');
    const audioFileInput = document.getElementById('audio-input'); // 新增
    const loading = document.getElementById('db-loading');
    const addBtn = document.getElementById('add-widget-btn');
    const diyBtn = document.getElementById('diy-btn');
    const doneBtn = document.getElementById('done-btn');

    async function exportAll() {
        try {
            document.getElementById('audio-upload-text').innerText = "正在打包整机数据...";
            
            // 1. 获取桌面数据
            await initDB();
            const layout = await getFromDB('layout');
            const settings = await getFromDB('settings');

            // 2. 潜入 Chat 的底层数据库获取数据 (跨应用读取)
            const chatDBData = {};
            const chatKeys = ['ins_posts_v1', 'ins_chat_list_v1', 'ins_chat_messages_v1', 'ins_chat_thoughts_v1'];
            const chatDbInstance = await new Promise((res) => {
                const req = indexedDB.open('InsChatLargeDB', 1);
                // 如果聊天数据库不存在就偷偷建一个
                req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains('store')) e.target.result.createObjectStore('store'); };
                req.onsuccess = e => res(e.target.result);
            });
            
            for (let k of chatKeys) {
                chatDBData[k] = await new Promise(res => {
                    try {
                        const tx = chatDbInstance.transaction('store', 'readonly');
                        const req = tx.objectStore('store').get(k);
                        req.onsuccess = () => res(req.result);
                        req.onerror = () => res(null);
                    } catch(e) { res(null); } // 防御性捕获
                });
            }

            // 3. 获取 Chat 的本地缓存 (API Key、钱包数据、小设定)
            const lsKeys = ['me_profile_config_v1', 'user_region', 'my_settings_v1', 'emoji_lib_v2', 'wl_data_v1', 'keep_alive_state', 'worldbook_entries_v1'];
            const lsData = {};
            lsKeys.forEach(k => {
                const val = localStorage.getItem(k);
                if (val) lsData[k] = val;
            });

            // 4. 打包为终极文件
            const backupData = { 
                type: "full_phone_backup", 
                timestamp: Date.now(),
                desktop: { layout, settings },
                chat_db: chatDBData,
                chat_ls: lsData
            };
            
            const blob = new Blob([JSON.stringify(backupData)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `兔兔手机_整机备份_${new Date().toLocaleDateString().replace(/\//g, '-')}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            document.getElementById('audio-upload-text').innerText = "点击选择 MP3 文件...";
            alert('✅ 终极整机备份已导出！\n包含：桌面壁纸、排版、聊天记录、AI设定、钱包、心声日记等全部数据！\n(提示: 仅灵动岛MP3过大需单独重新上传)');
        } catch (e) {
            console.error(e);
            alert('导出失败，请检查报错。');
        }
    }

    async function importAll(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                const data = JSON.parse(event.target.result);
                
                // 判断是否是新版的整机备份
                if (data.type === "full_phone_backup") {
                    
                    // 1. 恢复桌面
                    await initDB();
                    if (data.desktop.layout) await saveToDB('layout', data.desktop.layout);
                    if (data.desktop.settings) await saveToDB('settings', data.desktop.settings);

                    // 2. 恢复 Chat 的底层数据库
                    const chatDbInstance = await new Promise((res) => {
                        const req = indexedDB.open('InsChatLargeDB', 1);
                        req.onupgradeneeded = ev => { if (!ev.target.result.objectStoreNames.contains('store')) ev.target.result.createObjectStore('store'); };
                        req.onsuccess = ev => res(ev.target.result);
                    });
                    
                    if (data.chat_db) {
                        for (let k in data.chat_db) {
                            if (data.chat_db[k]) {
                                await new Promise(res => {
                                    const tx = chatDbInstance.transaction('store', 'readwrite');
                                    tx.objectStore('store').put(data.chat_db[k], k);
                                    tx.oncomplete = () => res();
                                });
                            }
                        }
                    }

                    // 3. 恢复 Chat 的本地缓存
                    if (data.chat_ls) {
                        for (let k in data.chat_ls) {
                            localStorage.setItem(k, data.chat_ls[k]);
                        }
                    }
                    
                    alert('✨ 终极整机数据恢复成功！包含聊天记录和桌面。\n即将重启手机...');
                    location.reload();
                    
                } else if (data.layout || data.settings) {
                    // 兼容你刚才测试导出的"仅桌面备份"文件
                    await initDB();
                    if (data.layout) await saveToDB('layout', data.layout);
                    if (data.settings) await saveToDB('settings', data.settings);
                    alert('✨ 仅桌面数据恢复成功！即将刷新页面...');
                    location.reload();
                } else {
                    alert('❌ 导入失败：无效的备份文件');
                }
            } catch (err) {
                alert('❌ 导入失败：文件解析错误');
                console.error(err);
            }
        };
        reader.readAsText(file);
        e.target.value = ''; 
    }

                    for(let appId in customAppIcons) {

                    dockEl.innerText = '';

                }
            });

            desktop.innerHTML = '';

                savedLayout.forEach(item => {

                        globalImageCache[item.id + '_bg'] = item.data.bg;
                        globalImageCache[item.id + '_avatar'] = item.data.avatar;

    }

    // --- 拖拽与逻辑 ---
    function findEmptySpot() {
        const grid = Array(7).fill().map(() => Array(4).fill(false));
        document.querySelectorAll('.app-item, .widget-item').forEach(el => {
            if(el.dataset.type === 'island') return; 
            let r = parseInt(el.dataset.row), c = parseInt(el.dataset.col);
            let type = el.dataset.type;
            if(r >= 0 && r < 7 && c >= 0 && c < 4) {
                grid[r][c] = true;
                if(type === 'music') grid[r][c+1] = true;
                if(type === 'twitter' || type === 'music') { if(r+1 < 7) { grid[r+1][c] = true; if(type === 'music') grid[r+1][c+1] = true; } }
            }
        });
        for(let r=0; r<6; r++) { for(let c=0; c<4; c++) { if(!grid[r][c]) return { r, c }; } }
        return { r: 0, c: 0 };
    }

    // ===== 打开 / 关闭 App =====
    function openApp(appId) {
        const url = APP_URLS[appId];
        if (!url) return;
        const overlay = document.getElementById('app-overlay');
        const iframe  = document.getElementById('app-iframe');
        iframe.src = url;
        overlay.classList.add('open');
    }
    function closeAppOverlay() {
        const overlay = document.getElementById('app-overlay');
        const iframe  = document.getElementById('app-iframe');
        overlay.classList.remove('open');
        setTimeout(() => { iframe.src = ''; }, 400);
    }

    function initDrag(el) {
        if(el.dataset.type === 'island') return;

        el.style.left = (layoutMarginX + el.dataset.col * CELL_W) + 'px';
        el.style.top = (0 + el.dataset.row * CELL_H) + 'px';
        
        if(el.querySelector('.remove-btn')) {
            el.querySelector('.remove-btn').onclick = (e) => { 
                e.stopPropagation(); el.remove(); updateAppStore(); saveLayout(); 
            };
        }
        
        const start = e => {
            if(e.target.closest('[contenteditable]')) return;
            
            if (!isEditing) {
                const ev0 = e.touches ? e.touches[0] : e;
                const startX = ev0.clientX, startY = ev0.clientY;
                let moved = false;
                const tapMove = m => {
                    const mv = m.touches ? m.touches[0] : m;
                    if (Math.abs(mv.clientX - startX) > 6 || Math.abs(mv.clientY - startY) > 6) moved = true;
                };
                const tapEnd = () => {
                    window.removeEventListener('mousemove', tapMove); window.removeEventListener('touchmove', tapMove);
                    window.removeEventListener('mouseup', tapEnd); window.removeEventListener('touchend', tapEnd);
                    if (!moved && el.dataset.type === 'app') {
                        openApp(el.dataset.id);
                    }
                };
                window.addEventListener('mousemove', tapMove); window.addEventListener('touchmove', tapMove, {passive: true});
                window.addEventListener('mouseup', tapEnd); window.addEventListener('touchend', tapEnd);
                return;
            }

            activeEl = el; const ev = e.touches ? e.touches[0] : e;
            const rect = el.getBoundingClientRect();
            const ox = ev.clientX - rect.left, oy = ev.clientY - rect.top;
            const moveHandler = move => {
                const mev = move.touches ? move.touches[0] : move;
                const dRect = desktop.getBoundingClientRect();
                el.classList.add('dragging');
                el.style.left = (mev.clientX - dRect.left - ox) + 'px';
                el.style.top = (mev.clientY - dRect.top - oy) + 'px';
            };
            const endHandler = () => {
                window.removeEventListener('mousemove', moveHandler); window.removeEventListener('touchmove', moveHandler);
                window.removeEventListener('mouseup', endHandler); window.removeEventListener('touchend', endHandler);
                if (activeEl && isEditing) {
                    let col = Math.round((parseFloat(activeEl.style.left) - layoutMarginX) / CELL_W);
                    let row = Math.round((parseFloat(activeEl.style.top) - 0) / CELL_H);
                    activeEl.dataset.col = Math.max(0, Math.min(activeEl.dataset.type==='music' ? 2 : 3, col)); 
                    activeEl.dataset.row = Math.max(0, Math.min(6, row));
                    activeEl.classList.remove('dragging');
                    activeEl.style.left = (layoutMarginX + activeEl.dataset.col * CELL_W) + 'px';
                    activeEl.style.top = (0 + activeEl.dataset.row * CELL_H) + 'px';
                    saveLayout();
                }
                activeEl = null;
            };
            window.addEventListener('mousemove', moveHandler); window.addEventListener('touchmove', moveHandler, {passive: false});
            window.addEventListener('mouseup', endHandler); window.addEventListener('touchend', endHandler);
        };
        el.addEventListener('mousedown', start); el.addEventListener('touchstart', start);
    }

    // --- 面板控制 ---
    function updateAppStore() {
        appStoreGrid.innerHTML = '';
        const installedIds = Array.from(document.querySelectorAll('.app-item')).map(el => el.dataset.id);
        for (let id in APP_DATABASE) {
            if(id.startsWith('dock-')) continue; 
            if (!installedIds.includes(id)) {
                const div = document.createElement('div');
                div.style = "display:flex; flex-direction:column; align-items:center; cursor:pointer;";
                div.innerHTML = `<div class="app-icon" style="width:55px; height:55px; font-size:26px;">${APP_DATABASE[id].icon}</div><div style="font-size:10px; margin-top:4px;">${APP_DATABASE[id].name}</div>`;
                div.onclick = () => { 
                    const spot = findEmptySpot(); createAppElement(id, spot.c, spot.r); 
                    if(isEditing) desktop.lastChild.classList.add('jiggling'); 
                    updateAppStore(); saveLayout(); 
                };
                appStoreGrid.appendChild(div);
            }
        }
    }

    function updateDiyGrid() {
        appDiyGrid.innerHTML = '';
        for (let id in APP_DATABASE) {
            const div = document.createElement('div');
            div.className = 'app-edit-item';
            
            let style = ''; let content = APP_DATABASE[id].icon;
            if(customAppIcons[id] && globalImageCache['icon_' + id]) {
                style = `background-image: ${globalImageCache['icon_' + id]}`;
                content = '';
            }

            div.innerHTML = `<div class="app-edit-icon" style="${style}">${content}</div><div class="app-edit-name">${APP_DATABASE[id].name}</div>`;
            div.onclick = () => {
                activeEditType = 'app-icon';
                activeAppId = id;
                imgInput.click();
            };
            appDiyGrid.appendChild(div);
        }
    }

    function addNewWidget(type) {
        const spot = findEmptySpot(type === 'music');
        if(type === 'twitter') createTwitterWidget(spot.c, spot.r); 
        else if(type === 'island') createIslandWidget(0, 0); 
        else if(type === 'memo') createMemoWidget(spot.c, spot.r);
        else createMusicWidget(spot.c, spot.r);
        
        if(isEditing) desktop.lastChild.classList.add('jiggling');
        closePanels(); saveLayout();
    }

    function closePanels() {
        widgetPanel.classList.remove('active');
        diyPanel.classList.remove('active');
    }

    addBtn.onclick = () => { updateAppStore(); closePanels(); widgetPanel.classList.add('active'); };
    diyBtn.onclick = () => { updateDiyGrid(); closePanels(); diyPanel.classList.add('active'); };

    function triggerWallaper(type) {
        activeEditType = (type === 'lock' ? 'wallpaper-lock' : 'wallpaper-home');
        imgInput.click();
    }

    imgInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const cssUrl = `url("${event.target.result}")`;

                if (activeEditType === 'widget') {
                    globalImageCache[currentImgKey] = cssUrl;
                    if(currentImgKey.includes('cover')) {
                        const id = currentImgKey.split('_')[0];
                        const el = document.querySelector(`.widget-music[data-id="${id}"] .music-cover`);
                        if(el) el.style.backgroundImage = cssUrl;
                    } else if(currentImgKey.includes('bg')) {
                        const id = currentImgKey.split('_')[0];
                        const el = document.querySelector(`.widget-twitter[data-id="${id}"] .tw-header`);
                        if(el) el.style.backgroundImage = cssUrl;
                    } else if(currentImgKey.includes('avatar')) {
                        const id = currentImgKey.split('_')[0];
                        const el = document.querySelector(`.widget-twitter[data-id="${id}"] .tw-avatar`);
                        if(el) el.style.backgroundImage = cssUrl;
                        // 备忘录头像
                        const memoEl = document.querySelector(`.widget-memo[data-id="${id}"] .memo-avatar`);
                        if(memoEl) memoEl.style.backgroundImage = cssUrl;
                    } else if(currentImgKey.includes('island')) {
                        const id = currentImgKey.split('_')[0];
                        const el = document.querySelector(`.widget-island[data-id="${id}"] .island-avatar`);
                        if(el) el.style.backgroundImage = cssUrl;
                    }
                } 
                else if (activeEditType === 'wallpaper-lock') {
                    globalImageCache['wallpaper_lock'] = cssUrl;
                    lockScreen.style.backgroundImage = cssUrl;
                    document.getElementById('wp-lock-preview').style.backgroundImage = cssUrl;
                }
                else if (activeEditType === 'wallpaper-home') {
                    globalImageCache['wallpaper_home'] = cssUrl;
                    document.getElementById('home-screen').style.backgroundImage = cssUrl;
                    document.getElementById('wp-home-preview').style.backgroundImage = cssUrl;
                }
                else if (activeEditType === 'app-icon') {
                    globalImageCache['icon_' + activeAppId] = cssUrl;
                    customAppIcons[activeAppId] = true; 
                    const desktopApp = document.querySelector(`.app-item[data-id="${activeAppId}"] .app-icon`);
                    if (desktopApp) { desktopApp.innerText = ''; desktopApp.style.backgroundImage = cssUrl; }
                    const dockApp = document.querySelector(`.app-icon[data-dock-id="${activeAppId}"]`);
                    if(dockApp) { dockApp.innerText = ''; dockApp.style.backgroundImage = cssUrl; }
                    updateDiyGrid(); 
                }

                saveLayout(); 
            };
        }
        imgInput.value = ''; 
    };

    // --- 交互 ---
    desktop.addEventListener('touchstart', (e) => {
        if (isEditing || e.target.closest('.remove-btn') || e.target.closest('[contenteditable]') || e.target.closest('.icon-btn') || e.target.classList.contains('widget-island')) return;
        longPressTimer = setTimeout(() => { 
            isEditing = true; 
            doneBtn.style.display = 'block'; 
            addBtn.style.display = 'block';
            diyBtn.style.display = 'block';
            document.querySelectorAll('.app-item, .widget-item').forEach(el => {
                if(!el.classList.contains('widget-island')) el.classList.add('jiggling');
            });
            document.querySelectorAll('.widget-island').forEach(el => el.classList.add('jiggling')); 
        }, 800);
    });
    desktop.addEventListener('touchend', () => clearTimeout(longPressTimer));
    
    doneBtn.onclick = () => { 
        isEditing = false; 
        doneBtn.style.display = 'none'; 
        addBtn.style.display = 'none';
        diyBtn.style.display = 'none';
        document.querySelectorAll('.app-item, .widget-item').forEach(el => el.classList.remove('jiggling')); 
        saveLayout(); 
    };

    let lStartY = 0;
    lockScreen.ontouchstart = (e) => { lStartY = e.touches[0].clientY; lockScreen.style.transition = 'none'; };
    lockScreen.ontouchmove = (e) => { let diff = e.touches[0].clientY - lStartY; if (diff < 0) lockScreen.style.transform = `translateY(${diff}px)`; };
    lockScreen.ontouchend = (e) => { lockScreen.style.transition = 'transform 0.4s ease'; if (e.changedTouches[0].clientY - lStartY < -150) lockScreen.style.transform = 'translateY(-100%)'; else lockScreen.style.transform = 'translateY(0)'; };
    document.getElementById('to-lock').onclick = () => { if(!isEditing) lockScreen.style.transform = 'translateY(0)'; };

    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        document.getElementById('date-str').innerText = `${d.getMonth()+1}月${d.getDate()}日 星期${days[d.getDay()]}`;
    }, 1000);

    loadLayout();

    // ===== Dock 图标点击打开 App =====
    document.querySelectorAll('.app-icon[data-dock-id]').forEach(el => {
        el.addEventListener('click', () => {
            const dockId = el.dataset.dockId;
            if (APP_URLS[dockId]) openApp(dockId);
        });
    });
</script>

</body>
